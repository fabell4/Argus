services:
  argus-scheduler:
    image: registry.greenflametech.net/argus:latest
    container_name: argus-scheduler
    restart: unless-stopped
    command: python -m src.main
    env_file: .env
    volumes:
      - argus-data:/app/data
      - argus-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  argus-api:
    image: registry.greenflametech.net/argus:latest
    container_name: argus-api
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - argus-data:/app/data
      - argus-logs:/app/logs
    depends_on:
      - argus-scheduler
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # Optional: InfluxDB v2 OSS
  # Uncomment if you want a local InfluxDB instance instead of an external one.
  # Set INFLUXDB_URL=http://influxdb:8086 and add influxdb to ENABLED_EXPORTERS.
  # ----------------------------------------------------------------------------
  # influxdb:
  #   image: influxdb:2
  #   container_name: argus-influxdb
  #   restart: unless-stopped
  #   ports:
  #     - "8086:8086"
  #   environment:
  #     DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
  #     DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
  #     DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
  #     DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
  #     DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
  #     DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
  #   volumes:
  #     - influxdb-data:/var/lib/influxdb2
  #   healthcheck:
  #     test: ["CMD", "influx", "ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # ----------------------------------------------------------------------------
  # Optional: Prometheus
  # Uncomment to run a local Prometheus instance that scrapes Argus metrics.
  # Set PROMETHEUS_ENABLED=true and add prometheus to ENABLED_EXPORTERS.
  # ----------------------------------------------------------------------------
  # prometheus:
  #   image: prom/prometheus:latest
