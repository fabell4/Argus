services:
  backend:
    build:
      context: ./backend
    container_name: argus-backend
    restart: unless-stopped
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: argus-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
