services:
  argus-scheduler:
    image: registry.greenflametech.net/argus:latest
    container_name: argus-scheduler
    restart: unless-stopped
    command: python -m src.main
    volumes:
      - argus-data:/app/data
      - argus-logs:/app/logs
    ports:
      # Health endpoint — exposed so you can curl from the host.
      - "${HEALTH_PORT:-9100}:${HEALTH_PORT:-9100}"
      # Prometheus metrics scrape endpoint. Required when Prometheus or Alloy
      # runs outside this compose stack. Safe to remove if the scraper is a
      # service in the same stack (it can reach argus-scheduler:9090 directly).
      - "${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      # --- Application ---
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-UTC}"
      # --- Polling ---
      POLL_INTERVAL_MINUTES: "${POLL_INTERVAL_MINUTES:-5}"
      POLL_ON_STARTUP: "${POLL_ON_STARTUP:-true}"
      # --- NUT (Network UPS Tools) ---
      # In Docker, localhost means the Argus container itself. Use the NUT
      # container/service name, host IP, or host.docker.internal instead.
      NUT_HOST: "${NUT_HOST:-localhost}"
      NUT_PORT: "${NUT_PORT:-3493}"
      NUT_USERNAME: "${NUT_USERNAME:-}"
      NUT_PASSWORD: "${NUT_PASSWORD:-}"
      NUT_UPS_NAME: "${NUT_UPS_NAME:-ups}"
      NUT_AUTO_DISCOVER: "${NUT_AUTO_DISCOVER:-true}"
      # --- SNMP ---
      SNMP_COMMUNITY: "${SNMP_COMMUNITY:-public}"
      SNMP_VERSION: "${SNMP_VERSION:-2c}"
      SNMP_TIMEOUT: "${SNMP_TIMEOUT:-5}"
      SNMP_RETRIES: "${SNMP_RETRIES:-2}"
      # --- SNMPv3 (leave blank to use community-string auth) ---
      SNMP_V3_USERNAME: "${SNMP_V3_USERNAME:-}"
      SNMP_V3_AUTH_PROTOCOL: "${SNMP_V3_AUTH_PROTOCOL:-MD5}"
      SNMP_V3_AUTH_KEY: "${SNMP_V3_AUTH_KEY:-}"
      SNMP_V3_PRIV_PROTOCOL: "${SNMP_V3_PRIV_PROTOCOL:-DES}"
      SNMP_V3_PRIV_KEY: "${SNMP_V3_PRIV_KEY:-}"
      # --- Exporters (comma-separated: sqlite|prometheus|influxdb|loki|csv|energy) ---
      ENABLED_EXPORTERS: "${ENABLED_EXPORTERS:-sqlite}"
      # --- SQLite ---
      SQLITE_PATH: "${SQLITE_PATH:-data/argus.db}"
      SQLITE_RETENTION_DAYS: "${SQLITE_RETENTION_DAYS:-90}"
      SQLITE_MAX_ROWS: "${SQLITE_MAX_ROWS:-100000}"
      # --- Prometheus ---
      PROMETHEUS_ENABLED: "${PROMETHEUS_ENABLED:-false}"
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:-9090}"
      PROMETHEUS_DISABLE_LABELS: "${PROMETHEUS_DISABLE_LABELS:-false}"
      # --- InfluxDB v2 ---
      INFLUXDB_ENABLED: "${INFLUXDB_ENABLED:-false}"
      INFLUXDB_URL: "${INFLUXDB_URL:-}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:-}"
      INFLUXDB_ORG: "${INFLUXDB_ORG:-}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET:-argus}"
      # --- Loki ---
      LOKI_URL: "${LOKI_URL:-}"
      LOKI_JOB_LABEL: "${LOKI_JOB_LABEL:-argus_power}"
      LOKI_TIMEOUT_SECONDS: "${LOKI_TIMEOUT_SECONDS:-5}"
      # --- CSV exporter ---
      CSV_PATH: "${CSV_PATH:-data/argus.csv}"
      CSV_MAX_SIZE_MB: "${CSV_MAX_SIZE_MB:-10}"
      CSV_RETENTION_DAYS: "${CSV_RETENTION_DAYS:-30}"
      # --- Energy accumulation ---
      ENERGY_RATE_PER_KWH: "${ENERGY_RATE_PER_KWH:-0}"
      # --- Event thresholds ---
      DEVICE_OFFLINE_MISSED_POLLS: "${DEVICE_OFFLINE_MISSED_POLLS:-3}"
      SHUTDOWN_BATTERY_FLOOR_PCT: "${SHUTDOWN_BATTERY_FLOOR_PCT:-5}"
      THRESHOLD_LOAD_PERCENT: "${THRESHOLD_LOAD_PERCENT:-90}"
      THRESHOLD_TEMP_CELSIUS: "${THRESHOLD_TEMP_CELSIUS:-50}"
      # --- Alerting ---
      ALERT_FAILURE_THRESHOLD: "${ALERT_FAILURE_THRESHOLD:-3}"
      ALERT_COOLDOWN_SECONDS: "${ALERT_COOLDOWN_SECONDS:-3600}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      GOTIFY_URL: "${GOTIFY_URL:-}"
      GOTIFY_TOKEN: "${GOTIFY_TOKEN:-}"
      GOTIFY_PRIORITY: "${GOTIFY_PRIORITY:-0}"
      NTFY_URL: "${NTFY_URL:-}"
      NTFY_TOPIC: "${NTFY_TOPIC:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      NTFY_PRIORITY: "${NTFY_PRIORITY:-}"
      NTFY_TAGS: "${NTFY_TAGS:-}"
      APPRISE_URL: "${APPRISE_URL:-}"
      # --- Health server ---
      HEALTH_PORT: "${HEALTH_PORT:-9100}"
    # Allow the scheduler container to reach services on the Docker host
    # (e.g. a locally-installed NUT daemon). On Linux, Docker does not
    # resolve host.docker.internal by default — this mapping fixes that.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false

  argus-api:
    image: registry.greenflametech.net/argus:latest
    container_name: argus-api
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - argus-data:/app/data
      - argus-logs:/app/logs
    depends_on:
      - argus-scheduler
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      # --- Application ---
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-UTC}"
      # --- SQLite (read-only queries) ---
      SQLITE_PATH: "${SQLITE_PATH:-data/argus.db}"
      # --- Energy ---
      ENERGY_RATE_PER_KWH: "${ENERGY_RATE_PER_KWH:-0}"
      # --- API ---
      API_HOST: "${API_HOST:-0.0.0.0}"
      API_PORT: "${API_PORT:-8000}"
      API_KEY: "${API_KEY:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      # --- Alerting ---
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      GOTIFY_URL: "${GOTIFY_URL:-}"
      GOTIFY_TOKEN: "${GOTIFY_TOKEN:-}"
      GOTIFY_PRIORITY: "${GOTIFY_PRIORITY:-0}"
      NTFY_URL: "${NTFY_URL:-}"
      NTFY_TOPIC: "${NTFY_TOPIC:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      NTFY_PRIORITY: "${NTFY_PRIORITY:-}"
      NTFY_TAGS: "${NTFY_TAGS:-}"
      APPRISE_URL: "${APPRISE_URL:-}"
    env_file:
      - path: .env
        required: false

  # ----------------------------------------------------------------------------
  # Optional: InfluxDB v2 OSS
  # Uncomment if you want a local InfluxDB instance instead of an external one.
  # Set INFLUXDB_URL=http://influxdb:8086 and add influxdb to ENABLED_EXPORTERS.
  # ----------------------------------------------------------------------------
  # influxdb:
  #   image: influxdb:2
  #   container_name: argus-influxdb
  #   restart: unless-stopped
  #   ports:
  #     - "8086:8086"
  #   environment:
  #     DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
  #     DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
  #     DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
  #     DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
  #     DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
  #     DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
  #   volumes:
  #     - influxdb-data:/var/lib/influxdb2
  #   healthcheck:
  #     test: ["CMD", "influx", "ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # ----------------------------------------------------------------------------
  # Optional: Prometheus (direct — no Alloy)
  # Uncomment to run a local Prometheus instance that scrapes Argus metrics.
  # Add prometheus to ENABLED_EXPORTERS and provide a prometheus.yml that
  # targets argus-scheduler:9090. Host port 9091 is used here to avoid
  # colliding with Argus's own metrics port (9090) if both are exposed.
  #
  # Direct:  Prometheus scrapes argus-scheduler:9090 itself.
  # Via Alloy: comment this out and use the Alloy block below instead.
  # ----------------------------------------------------------------------------
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: argus-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9091:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus

  # ----------------------------------------------------------------------------
  # Optional: Loki (direct — no Alloy)
  # Uncomment to run a local Loki instance. Set LOKI_URL=http://loki:3100 and
  # add loki to ENABLED_EXPORTERS. Argus pushes directly to Loki's push API.
  #
  # Direct:  LOKI_URL=http://loki:3100
  # Via Alloy: comment this out, set LOKI_URL to Alloy's Loki receiver port
  #            (e.g. http://alloy:3500) and use the Alloy block below instead.
  # ----------------------------------------------------------------------------
  # loki:
  #   image: grafana/loki:latest
  #   container_name: argus-loki
  #   restart: unless-stopped
  #   ports:
  #     - "3100:3100"
  #   volumes:
  #     - loki-data:/loki

  # ----------------------------------------------------------------------------
  # Optional: Grafana
  # Uncomment to run a local Grafana instance. Import docs/grafana-dashboard.json
  # and connect it to your Prometheus and/or Loki datasource.
  # ----------------------------------------------------------------------------
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: argus-grafana
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #   depends_on:
  #     - prometheus   # remove if not using local prometheus
  #     - loki         # remove if not using local loki

  # ----------------------------------------------------------------------------
  # Optional: Grafana Alloy (replaces standalone Prometheus + Loki above)
  # Use Alloy when you already have a central Grafana stack (Cloud or self-hosted)
  # and want a single collector sidecar instead of local Prometheus/Loki.
  #
  # Prometheus side: Alloy scrapes argus-scheduler:9090; no LOKI_URL needed.
  # Loki side:       Set LOKI_URL=http://alloy:3500 (or whichever port your
  #                  alloy.river exposes its loki.source.api receiver on).
  # ----------------------------------------------------------------------------
  # alloy:
  #   image: grafana/alloy:latest
  #   container_name: argus-alloy
  #   restart: unless-stopped
  #   ports:
  #     - "12345:12345"   # Alloy UI
  #     - "3500:3500"     # Loki push receiver (match LOKI_URL port)
  #   volumes:
  #     - ./alloy.river:/etc/alloy/config.river:ro
  #   depends_on:
  #     - argus-scheduler

volumes:
  argus-data:
  argus-logs:
  # influxdb-data:   # uncomment when influxdb service is enabled
  # prometheus-data: # uncomment when prometheus service is enabled
  # loki-data:       # uncomment when loki service is enabled
  # grafana-data:    # uncomment when grafana service is enabled
