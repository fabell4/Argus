services:
  argus-scheduler:
    image: registry.greenflametech.net/argus:latest
    container_name: argus-scheduler
    restart: unless-stopped
    command: python -m src.main
    volumes:
      - argus-data:/app/data
      - argus-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      # --- Application ---
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-UTC}"
      # --- Polling ---
      POLL_INTERVAL_MINUTES: "${POLL_INTERVAL_MINUTES:-5}"
      POLL_ON_STARTUP: "${POLL_ON_STARTUP:-true}"
      # --- NUT (Network UPS Tools) ---
      # In Docker, localhost means the Argus container itself. Use the NUT
      # container/service name, host IP, or host.docker.internal instead.
      NUT_HOST: "${NUT_HOST:-localhost}"
      NUT_PORT: "${NUT_PORT:-3493}"
      NUT_USERNAME: "${NUT_USERNAME:-}"
      NUT_PASSWORD: "${NUT_PASSWORD:-}"
      NUT_UPS_NAME: "${NUT_UPS_NAME:-ups}"
      NUT_AUTO_DISCOVER: "${NUT_AUTO_DISCOVER:-true}"
      # --- SNMP ---
      SNMP_COMMUNITY: "${SNMP_COMMUNITY:-public}"
      SNMP_VERSION: "${SNMP_VERSION:-2c}"
      SNMP_TIMEOUT: "${SNMP_TIMEOUT:-5}"
      SNMP_RETRIES: "${SNMP_RETRIES:-2}"
      # --- SNMPv3 (leave blank to use community-string auth) ---
      SNMP_V3_USERNAME: "${SNMP_V3_USERNAME:-}"
      SNMP_V3_AUTH_PROTOCOL: "${SNMP_V3_AUTH_PROTOCOL:-MD5}"
      SNMP_V3_AUTH_KEY: "${SNMP_V3_AUTH_KEY:-}"
      SNMP_V3_PRIV_PROTOCOL: "${SNMP_V3_PRIV_PROTOCOL:-DES}"
      SNMP_V3_PRIV_KEY: "${SNMP_V3_PRIV_KEY:-}"
      # --- Exporters (comma-separated: sqlite|prometheus|influxdb|loki|csv|energy) ---
      ENABLED_EXPORTERS: "${ENABLED_EXPORTERS:-sqlite}"
      # --- SQLite ---
      SQLITE_PATH: "${SQLITE_PATH:-data/argus.db}"
      SQLITE_RETENTION_DAYS: "${SQLITE_RETENTION_DAYS:-90}"
      SQLITE_MAX_ROWS: "${SQLITE_MAX_ROWS:-100000}"
      # --- Prometheus ---
      PROMETHEUS_ENABLED: "${PROMETHEUS_ENABLED:-false}"
      PROMETHEUS_PORT: "${PROMETHEUS_PORT:-9090}"
      PROMETHEUS_DISABLE_LABELS: "${PROMETHEUS_DISABLE_LABELS:-false}"
      # --- InfluxDB v2 ---
      INFLUXDB_ENABLED: "${INFLUXDB_ENABLED:-false}"
      INFLUXDB_URL: "${INFLUXDB_URL:-}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:-}"
      INFLUXDB_ORG: "${INFLUXDB_ORG:-}"
      INFLUXDB_BUCKET: "${INFLUXDB_BUCKET:-argus}"
      # --- Loki ---
      LOKI_URL: "${LOKI_URL:-}"
      LOKI_JOB_LABEL: "${LOKI_JOB_LABEL:-argus_power}"
      LOKI_TIMEOUT_SECONDS: "${LOKI_TIMEOUT_SECONDS:-5}"
      # --- CSV exporter ---
      CSV_PATH: "${CSV_PATH:-data/argus.csv}"
      CSV_MAX_SIZE_MB: "${CSV_MAX_SIZE_MB:-10}"
      CSV_RETENTION_DAYS: "${CSV_RETENTION_DAYS:-30}"
      # --- Energy accumulation ---
      ENERGY_RATE_PER_KWH: "${ENERGY_RATE_PER_KWH:-0}"
      # --- Event thresholds ---
      DEVICE_OFFLINE_MISSED_POLLS: "${DEVICE_OFFLINE_MISSED_POLLS:-3}"
      SHUTDOWN_BATTERY_FLOOR_PCT: "${SHUTDOWN_BATTERY_FLOOR_PCT:-5}"
      THRESHOLD_LOAD_PERCENT: "${THRESHOLD_LOAD_PERCENT:-90}"
      THRESHOLD_TEMP_CELSIUS: "${THRESHOLD_TEMP_CELSIUS:-50}"
      # --- Alerting ---
      ALERT_FAILURE_THRESHOLD: "${ALERT_FAILURE_THRESHOLD:-3}"
      ALERT_COOLDOWN_SECONDS: "${ALERT_COOLDOWN_SECONDS:-3600}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      GOTIFY_URL: "${GOTIFY_URL:-}"
      GOTIFY_TOKEN: "${GOTIFY_TOKEN:-}"
      GOTIFY_PRIORITY: "${GOTIFY_PRIORITY:-0}"
      NTFY_URL: "${NTFY_URL:-}"
      NTFY_TOPIC: "${NTFY_TOPIC:-}"
      NTFY_TOKEN: "${NTFY_TOKEN:-}"
      NTFY_PRIORITY: "${NTFY_PRIORITY:-}"
      NTFY_TAGS: "${NTFY_TAGS:-}"
      APPRISE_URL: "${APPRISE_URL:-}"
      # --- Health server ---
      HEALTH_PORT: "${HEALTH_PORT:-9100}"
    # Allow the scheduler container to reach services on the Docker host
    # (e.g. a locally-installed NUT daemon). On Linux, Docker does not
    # resolve host.docker.internal by default — this mapping fixes that.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false

  argus-api:
    image: registry.greenflametech.net/argus:latest
    container_name: argus-api
    restart: unless-stopped
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - argus-data:/app/data
      - argus-logs:/app/logs
    depends_on:
      - argus-scheduler
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      # --- Application ---
      APP_ENV: "${APP_ENV:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-UTC}"
      # --- SQLite (read-only queries) ---
      SQLITE_PATH: "${SQLITE_PATH:-data/argus.db}"
      # --- Energy ---
      ENERGY_RATE_PER_KWH: "${ENERGY_RATE_PER_KWH:-0}"
      # --- API ---
      API_HOST: "${API_HOST:-0.0.0.0}"
      API_PORT: "${API_PORT:-8000}"
      API_KEY: "${API_KEY:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-60}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
    env_file:
      - path: .env
        required: false

  # ----------------------------------------------------------------------------
  # Optional: InfluxDB v2 OSS
  # Uncomment if you want a local InfluxDB instance instead of an external one.
  # Set INFLUXDB_URL=http://influxdb:8086 and add influxdb to ENABLED_EXPORTERS.
  # ----------------------------------------------------------------------------
  # influxdb:
  #   image: influxdb:2
  #   container_name: argus-influxdb
  #   restart: unless-stopped
  #   ports:
  #     - "8086:8086"
  #   environment:
  #     DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
  #     DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
  #     DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
  #     DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
  #     DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
  #     DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
  #   volumes:
  #     - influxdb-data:/var/lib/influxdb2
  #   healthcheck:
  #     test: ["CMD", "influx", "ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # ----------------------------------------------------------------------------
  # Optional: Prometheus
  # Uncomment to run a local Prometheus instance that scrapes Argus metrics.
  # Set PROMETHEUS_ENABLED=true and add prometheus to ENABLED_EXPORTERS.
  # ----------------------------------------------------------------------------
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: argus-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus

  # ----------------------------------------------------------------------------
  # Loki / Grafana — if you have these on a central server, point LOKI_URL at
  # your existing instance and add loki to ENABLED_EXPORTERS. No local container
  # needed.
  # ----------------------------------------------------------------------------

volumes:
  argus-data:
  argus-logs:
  # influxdb-data:   # uncomment when influxdb service is enabled
  # prometheus-data: # uncomment when prometheus service is enabled
