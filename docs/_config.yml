# Jekyll configuration for Argus Docs

title: Argus Documentation
description: Self-hosted power monitoring for UPS devices, PDUs, and sensors with full observability stack integration
url: https://argus-docs.greenflametech.com
baseurl: ""

favicon: /assets/argus.png

# Top navbar links
nav_links:
  - title: Home
    url: /
  - title: Getting Started
    url: /getting-started
  - title: API Reference
    url: /api-reference
  - title: Security
    url: /security

# Footer links
footer:
  github: https://github.com/fabell4/argus
  linkedin: https://www.linkedin.com/in/alex-bell-iv
  main_site: https://www.greenflametech.com

# GitHub metadata
repository: fabell4/argus

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jekyll-relative-links

exclude:
  - zeniscal.yml
  - Gemfile
  - Gemfile.lock
  - grafana-dashboard.json
  - "*.json"
