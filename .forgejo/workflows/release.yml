name: Release — Argus

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0-beta)"
        required: true
        type: string

defaults:
  run:
    shell: bash

# ---------------------------------------------------------------------------
# Job 1: validate
#   All quality and security gates. If any step fails the entire release
#   pipeline aborts here — nothing is built or published externally.
#
# Job 2: build-and-push
#   Builds the Docker image and pushes to the internal private registry and
#   GHCR. Runs only after validate succeeds.
#
# Job 3: publish-public
#   Sanitizes the repo (strips internal infra), pushes the release branch and
#   tag to the public GitHub repo, creates the GitHub + Forgejo releases.
#   Runs only after build-and-push succeeds.
# ---------------------------------------------------------------------------

jobs:

  # -------------------------------------------------------------------------
  # Job 1 — Validate: all gates that must pass before anything leaves Forgejo
  # -------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: docker
    timeout-minutes: 20
    container:
      image: registry.greenflametech.net/gft-python-runner:latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff — lint and format check
        run: |
          ruff check src
          ruff format --check src

      - name: Bandit — security scan
        run: |
          bandit -r src -ll

      - name: pip-audit — dependency vulnerability scan
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-full
          python3 -m pip install --quiet --break-system-packages pip-audit
          python3 -m pip_audit -r requirements.txt
          echo "pip-audit passed — no known vulnerabilities"

      - name: pytest — unit tests
        run: |
          pytest --cov=src --cov-fail-under=85 -q

  # -------------------------------------------------------------------------
  # Job 2 — Build and push: internal artefacts only (private registry + GHCR)
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build and push (internal)
    runs-on: docker
    timeout-minutes: 30
    needs: validate
    container:
      image: registry.greenflametech.net/gft-ci-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract changelog notes
        run: python3 scripts/extract_changelog.py
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Upload changelog notes artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: changelog-notes
          path: /tmp/changelog_notes.txt
          retention-days: 1

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login docker.io \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

      - name: Log in to private registry
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login registry.greenflametech.net \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

      - name: Log in to GHCR
        if: ${{ secrets.GH_PAT != '' && secrets.GH_USERNAME != '' }}
        run: |
          echo "${{ secrets.GH_PAT }}" | \
            docker login ghcr.io \
              --username "${{ secrets.GH_USERNAME }}" \
              --password-stdin

      - name: Build image
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          docker build \
            --platform linux/amd64 \
            --build-arg APP_VERSION="${{ needs.validate.outputs.version }}" \
            --label org.opencontainers.image.source="https://github.com/${GH_USERNAME}/Argus" \
            --label org.opencontainers.image.version="${{ needs.validate.outputs.version }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.created="${CREATED}" \
            --tag registry.greenflametech.net/argus:${{ needs.validate.outputs.version }} \
            --tag registry.greenflametech.net/argus:latest \
            --tag ghcr.io/${{ secrets.GH_USERNAME }}/argus:${{ needs.validate.outputs.version }} \
            --tag ghcr.io/${{ secrets.GH_USERNAME }}/argus:latest \
            .

      - name: Push to private registry
        run: |
          docker push registry.greenflametech.net/argus:${{ needs.validate.outputs.version }}
          docker push registry.greenflametech.net/argus:latest

      - name: Push to GHCR
        if: ${{ secrets.GH_PAT != '' && secrets.GH_USERNAME != '' }}
        run: |
          docker push ghcr.io/${{ secrets.GH_USERNAME }}/argus:${{ needs.validate.outputs.version }}
          docker push ghcr.io/${{ secrets.GH_USERNAME }}/argus:latest

      - name: Make GHCR package public
        if: ${{ secrets.GH_PAT != '' && secrets.GH_USERNAME != '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          PKG_URL="https://api.github.com/user/packages/container/argus"
          AUTH=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_PAT}" -H "X-GitHub-Api-Version: 2022-11-28")

          GET_HTTP=$(curl -s -o /tmp/pkg_get.json -w "%{http_code}" "${AUTH[@]}" "${PKG_URL}")
          echo "GET /user/packages/container/argus → HTTP ${GET_HTTP}"
          if [ "${GET_HTTP}" = "200" ]; then
            VISIBILITY=$(python3 -c "import json,sys; d=json.load(open('/tmp/pkg_get.json')); print(d.get('visibility','unknown'))")
            echo "Current package visibility: ${VISIBILITY}"
            if [ "${VISIBILITY}" = "public" ]; then
              echo "Package is already public — skipping PATCH."
              exit 0
            fi
          else
            echo "WARNING: Could not read package metadata (HTTP ${GET_HTTP}). Attempting PATCH anyway."
          fi

          HTTP=$(curl -s -o /tmp/pkg_resp.json -w "%{http_code}" \
            -X PATCH "${AUTH[@]}" "${PKG_URL}" \
            -d '{"visibility":"public"}')
          echo "PATCH /user/packages/container/argus → HTTP ${HTTP}"
          cat /tmp/pkg_resp.json
          if [ "${HTTP}" = "200" ]; then
            echo "GHCR package is now public."
          else
            echo "WARNING: Could not set GHCR package visibility (HTTP ${HTTP})."
            echo "Check that GH_PAT has 'write:packages' scope and the Forgejo secret is up to date."
          fi

  # -------------------------------------------------------------------------
  # Job 3 — Publish public: sanitize + push to GitHub, create releases.
  # -------------------------------------------------------------------------
  publish-public:
    name: Publish (public)
    runs-on: docker
    timeout-minutes: 20
    needs: [validate, build-and-push]
    container:
      image: registry.greenflametech.net/gft-ci-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download changelog notes artifact
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: changelog-notes
          path: /tmp

      - name: Push sanitized release to public GitHub repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git config user.email "ci@greenflametech.net"
          git config user.name "Argus CI"
          git fetch --unshallow origin 2>/dev/null || true

          curl -s -X DELETE \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/branches/main/protection" || true

          RULESETS=$(curl -s \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/rulesets?includes_parents=false")
          echo "Rulesets found: $(echo "${RULESETS}" | jq 'length')"
          echo "${RULESETS}" | jq -r '.[].id' | while read -r ruleset_id; do
            echo "Deleting ruleset ${ruleset_id}"
            curl -s -X DELETE \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_USERNAME}/Argus/rulesets/${ruleset_id}"
          done

          git checkout -b public-release

          # Remove internal-only files/directories
          rm -rf .forgejo/

          # Restore public Docker Hub base image
          sed -i 's|FROM registry\.greenflametech\.net/python:3\.12-slim|FROM python:3.12-slim|g' Dockerfile

          # Strip internal sonar.host.url
          sed -i '/^sonar\.host\.url=/d' sonar-project.properties

          git add -A
          git commit -m "chore: prepare public release ${TAG} (strip internal infra config)"

          GITHUB_REPO_URL="https://${GH_USERNAME}:${GH_PAT}@github.com/${GH_USERNAME}/Argus.git"
          git remote add github "${GITHUB_REPO_URL}"

          git push github public-release:refs/heads/main --force

          git tag -f "${TAG}"
          curl -s -X DELETE \
            -H "Authorization: Bearer ${GH_PAT}" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/git/refs/tags/${TAG}" || true
          git push github "${TAG}"

          git remote remove github || true
          git branch -D public-release || true

      - name: Create GitHub release
        run: python3 scripts/create_github_release.py
        env:
          TAG:           ${{ needs.validate.outputs.tag }}
          VERSION:       ${{ needs.validate.outputs.version }}
          GH_USERNAME:   ${{ secrets.GH_USERNAME }}
          GH_PAT:        ${{ secrets.GH_PAT }}
          NOTES_FILE:    /tmp/changelog_notes.txt
          PAYLOAD_FILE:  /tmp/gh_release_payload.json
          RESPONSE_FILE: /tmp/gh_response.json

      - name: Trigger GHCR package link workflow on public repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          sleep 15

          HTTP=$(curl -s -o /tmp/dispatch_resp.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/actions/workflows/link-ghcr-package.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"${VERSION}\"}}")
          echo "POST workflow_dispatch → HTTP ${HTTP}"
          cat /tmp/dispatch_resp.json
          if [ "${HTTP}" = "204" ]; then
            echo "link-ghcr-package workflow dispatched — package will be linked by GitHub Actions."
          else
            echo "WARNING: Could not dispatch link-ghcr-package workflow (HTTP ${HTTP}). Package link may need to be done manually."
          fi

      - name: Prepare Forgejo release assets
        run: |
          mkdir -p /tmp/release-assets
          if [ -f /tmp/changelog_notes.txt ]; then
            cp /tmp/changelog_notes.txt /tmp/release-assets/RELEASE-NOTES.md
          fi

      - name: Delete existing Forgejo release (if any)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          REPO_API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${REPO_API}/releases/tags/${TAG}" | jq -r '.id // empty')
          if [ -n "${RELEASE_ID}" ]; then
            echo "Deleting existing release id=${RELEASE_ID} for tag ${TAG}"
            curl -s -X DELETE -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${REPO_API}/releases/${RELEASE_ID}"
          else
            echo "No existing release found for tag ${TAG}"
          fi

      - name: Create Forgejo release
        uses: https://data.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: /tmp/release-assets
          token: ${{ secrets.FORGEJO_TOKEN }}
          tag: ${{ needs.validate.outputs.tag }}
          prerelease: ${{ contains(needs.validate.outputs.tag, 'alpha') || contains(needs.validate.outputs.tag, 'beta') || contains(needs.validate.outputs.tag, 'rc') }}
