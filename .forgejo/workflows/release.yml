name: Release — Argus

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0-beta)"
        required: true
        type: string

defaults:
  run:
    shell: bash

# ---------------------------------------------------------------------------
# Job 1: validate
#   All quality and security gates. If any step fails the entire release
#   pipeline aborts here — nothing is built or published externally.
#
# Job 2: build-and-push
#   Builds the Docker image and pushes to the internal private registry and
#   GHCR. Runs only after validate succeeds.
#
# Job 3: publish-public
#   Sanitizes the repo (strips internal infra), pushes the release branch and
#   tag to the public GitHub repo, creates the GitHub + Forgejo releases.
#   Runs only after build-and-push succeeds.
# ---------------------------------------------------------------------------

jobs:

  # -------------------------------------------------------------------------
  # Job 1 — Validate: all gates that must pass before anything leaves Forgejo
  # -------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: docker
    timeout-minutes: 20
    container:
      image: registry.greenflametech.net/gft-python-runner:latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff — lint and format check
        run: |
          ruff check src
          ruff format --check src

      - name: Bandit — security scan
        run: |
          bandit -r src -ll

      - name: pip-audit — dependency vulnerability scan
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-full
          python3 -m pip install --quiet --break-system-packages pip-audit
          python3 -m pip_audit -r requirements.txt
          echo "pip-audit passed — no known vulnerabilities"

      - name: pytest — unit tests
        run: |
          pytest --cov=src --cov-fail-under=85 -q

  # -------------------------------------------------------------------------
  # Job 2 — Build and push: internal artefacts only (private registry)
  # GHCR is handled by GitHub Actions (.github/workflows/publish-ghcr.yml) using
  # GITHUB_TOKEN so that GitHub auto-links the package to the Argus repository.
  # -------------------------------------------------------------------------
  build-and-push:
    name: Build and push (internal)
    runs-on: docker
    timeout-minutes: 30
    needs: validate
    container:
      image: registry.greenflametech.net/gft-ci-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract changelog notes
        run: python3 scripts/extract_changelog.py
        env:
          VERSION: ${{ needs.validate.outputs.version }}

      - name: Upload changelog notes artifact
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: changelog-notes
          path: /tmp/changelog_notes.txt
          retention-days: 1

      - name: Diagnose registry connectivity
        run: |
          echo "=== ~/.docker/config.json ==="
          cat ~/.docker/config.json 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Docker daemon proxy settings ==="
          docker info --format 'HTTPProxy={{.HTTPProxy}}  HTTPSProxy={{.HTTPSProxy}}  NoProxy={{.NoProxy}}' 2>&1 || true

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
            docker login docker.io \
              --username "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

      - name: Log in to private registry
        if: ${{ secrets.REGISTRY_USERNAME != '' }}
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | \
            docker login registry.greenflametech.net \
              --username "${{ secrets.REGISTRY_USERNAME }}" \
              --password-stdin

      - name: Build image
        run: |
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          docker build \
            --build-arg APP_VERSION="${{ needs.validate.outputs.version }}" \
            --label org.opencontainers.image.source="https://github.com/${{ secrets.GH_USERNAME }}/Argus" \
            --label org.opencontainers.image.version="${{ needs.validate.outputs.version }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.created="${CREATED}" \
            --tag registry.greenflametech.net/argus:${{ needs.validate.outputs.version }} \
            .

      - name: Push to private registry
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          docker push registry.greenflametech.net/argus:${{ needs.validate.outputs.version }}
          if [[ ! "${TAG}" =~ alpha|beta|rc ]]; then
            docker tag registry.greenflametech.net/argus:${{ needs.validate.outputs.version }} registry.greenflametech.net/argus:latest
            docker push registry.greenflametech.net/argus:latest
          else
            echo "Pre-release tag (${TAG}) — skipping :latest push to private registry"
          fi

      - name: Log private registry push complete
        run: echo "Private registry push complete. GHCR publish handled by GitHub Actions on tag push."

  # -------------------------------------------------------------------------
  # Job 3 — Publish public: sanitize + push to GitHub, create releases.
  # -------------------------------------------------------------------------
  publish-public:
    name: Publish (public)
    runs-on: docker
    timeout-minutes: 20
    needs: [validate, build-and-push]
    container:
      image: registry.greenflametech.net/gft-ci-runner:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download changelog notes artifact
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: changelog-notes
          path: /tmp

      - name: Save branch protection rules before release
        id: save-protection
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          # Save current branch protection and rulesets before deletion
          mkdir -p /tmp/github-protection
          
          curl -s -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/branches/main/protection" \
            > /tmp/github-protection/main-protection.json 2>/dev/null || echo '{}' > /tmp/github-protection/main-protection.json
          
          curl -s -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/rulesets?includes_parents=false" \
            > /tmp/github-protection/rulesets.json 2>/dev/null || echo '[]' > /tmp/github-protection/rulesets.json
          
          echo "Branch protection rules saved for restoration after release."

      - name: Push sanitized release to public GitHub repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          git config user.email "ci@greenflametech.net"
          git config user.name "Argus CI"
          git fetch --unshallow origin 2>/dev/null || true

          curl -s -X DELETE \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/branches/main/protection" || true

          RULESETS=$(curl -s \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/rulesets?includes_parents=false")
          echo "Rulesets found: $(echo "${RULESETS}" | jq 'length')"
          echo "${RULESETS}" | jq -r '.[].id' | while read -r ruleset_id; do
            echo "Deleting ruleset ${ruleset_id}"
            curl -s -X DELETE \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_USERNAME}/Argus/rulesets/${ruleset_id}"
          done

          git checkout -b public-release

          # Remove internal-only files/directories
          rm -rf .forgejo/

          # Restore public Docker Hub base image
          sed -i 's|FROM registry\.greenflametech\.net/python:3\.12-slim|FROM python:3.12-slim|g' Dockerfile

          # Strip internal sonar.host.url
          sed -i '/^sonar\.host\.url=/d' sonar-project.properties

          git add -A
          git commit -m "chore: prepare public release ${TAG} (strip internal infra config)"

          git remote add github "https://github.com/${GH_USERNAME}/Argus.git"
          git config http.https://github.com/.extraheader \
            "Authorization: Basic $(printf '%s:%s' "${GH_USERNAME}" "${GH_PAT}" | base64 -w0)"

          git push github public-release:refs/heads/main --force

          git tag -f "${TAG}"
          curl -s -X DELETE \
            -H "Authorization: Bearer ${GH_PAT}" \
            "https://api.github.com/repos/${GH_USERNAME}/Argus/git/refs/tags/${TAG}" || true
          git push github "${TAG}"

          git config --unset http.https://github.com/.extraheader || true
          git remote remove github || true
          git branch -D public-release || true

      - name: Create GitHub release
        run: python3 scripts/create_github_release.py
        env:
          TAG:           ${{ needs.validate.outputs.tag }}
          VERSION:       ${{ needs.validate.outputs.version }}
          GH_USERNAME:   ${{ secrets.GH_USERNAME }}
          GH_PAT:        ${{ secrets.GH_PAT }}
          NOTES_FILE:    /tmp/changelog_notes.txt
          PAYLOAD_FILE:  /tmp/gh_release_payload.json
          RESPONSE_FILE: /tmp/gh_response.json

      - name: Prepare Forgejo release assets
        run: |
          mkdir -p /tmp/release-assets
          if [ -f /tmp/changelog_notes.txt ]; then
            cp /tmp/changelog_notes.txt /tmp/release-assets/RELEASE-NOTES.md
          fi

      - name: Delete existing Forgejo release (if any)
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          REPO_API="${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          RELEASE_ID=$(curl -s -H "Authorization: token ${FORGEJO_TOKEN}" \
            "${REPO_API}/releases/tags/${TAG}" | jq -r '.id // empty')
          if [ -n "${RELEASE_ID}" ]; then
            echo "Deleting existing release id=${RELEASE_ID} for tag ${TAG}"
            curl -s -X DELETE -H "Authorization: token ${FORGEJO_TOKEN}" \
              "${REPO_API}/releases/${RELEASE_ID}"
          else
            echo "No existing release found for tag ${TAG}"
          fi

      - name: Create Forgejo release
        uses: https://data.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: /tmp/release-assets
          token: ${{ secrets.FORGEJO_TOKEN }}
          tag: ${{ needs.validate.outputs.tag }}
          prerelease: ${{ contains(needs.validate.outputs.tag, 'alpha') || contains(needs.validate.outputs.tag, 'beta') || contains(needs.validate.outputs.tag, 'rc') }}
          sha-check: 'false'

      - name: Restore branch protection rules on GitHub
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          # Restore branch protection and rulesets after successful release
          if [ -f /tmp/github-protection/main-protection.json ]; then
            PROTECTION=$(cat /tmp/github-protection/main-protection.json)
            if [ "$(echo "${PROTECTION}" | jq 'keys | length')" -gt 0 ]; then
              echo "Restoring main branch protection..."
              HTTP=$(curl -s -o /tmp/protection_resp.json -w "%{http_code}" \
                -X PUT \
                -H "Authorization: Bearer ${GH_PAT}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GH_USERNAME}/Argus/branches/main/protection" \
                -d "${PROTECTION}")
              echo "PUT /branches/main/protection → HTTP ${HTTP}"
              if [ "${HTTP}" != "200" ]; then
                echo "WARNING: Could not fully restore branch protection (HTTP ${HTTP})."
                cat /tmp/protection_resp.json
              else
                echo "✅ Main branch protection restored."
              fi
            fi
          fi

          # Restore rulesets if they were saved
          if [ -f /tmp/github-protection/rulesets.json ]; then
            RULESETS=$(cat /tmp/github-protection/rulesets.json)
            RULESET_COUNT=$(echo "${RULESETS}" | jq 'length')
            if [ "${RULESET_COUNT}" -gt 0 ]; then
              echo "Restoring ${RULESET_COUNT} rulesets..."
              echo "${RULESETS}" | jq -c '.[]' | while read -r ruleset; do
                RULESET_ID=$(echo "${ruleset}" | jq -r '.id')
                echo "Recreating ruleset ${RULESET_ID}..."
                # Omit id from the payload for creation
                RULESET_PAYLOAD=$(echo "${ruleset}" | jq 'del(.id, .created_at, .updated_at)')
                HTTP=$(curl -s -o /tmp/ruleset_resp.json -w "%{http_code}" \
                  -X POST \
                  -H "Authorization: Bearer ${GH_PAT}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${GH_USERNAME}/Argus/rulesets" \
                  -d "${RULESET_PAYLOAD}")
                if [ "${HTTP}" = "201" ]; then
                  echo "✅ Ruleset ${RULESET_ID} restored."
                else
                  echo "⚠️  Ruleset ${RULESET_ID} restoration returned HTTP ${HTTP}"
                fi
              done
            fi
          fi

