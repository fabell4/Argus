name: Publish to GHCR

# Triggered automatically when Forgejo's release pipeline pushes the version tag
# to the public GitHub repo. Builds and pushes the image using GITHUB_TOKEN so
# that GitHub natively links the package to this repository.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.2-beta, without leading v)"
        required: true
        type: string

jobs:
  publish-ghcr:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/v0.3.2-beta  →  0.3.2-beta
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            TAG="v${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Stable if tag contains no pre-release suffix
          if echo "${TAG}" | grep -qE '(alpha|beta|rc)'; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push versioned tag
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/argus:${{ steps.meta.outputs.version }}

      - name: Also tag as latest (stable releases only)
        if: ${{ steps.meta.outputs.latest == 'true' }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/argus:latest" \
            "ghcr.io/${{ github.repository_owner }}/argus:${{ steps.meta.outputs.version }}"
          echo "Tagged ghcr.io/${{ github.repository_owner }}/argus:latest"
