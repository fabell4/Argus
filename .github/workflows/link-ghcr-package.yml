name: Publish to GHCR

# Triggered automatically when Forgejo's release pipeline pushes the version tag
# to the public GitHub repo. Builds and pushes the image using GITHUB_TOKEN so
# that GitHub natively links the package to this repository.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.2-beta, without leading v)"
        required: true
        type: string

jobs:
  publish-ghcr:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Preflight GHCR package access
        if: ${{ env.GHCR_PAT == '' }}
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If this package was originally created outside GitHub Actions,
          # GITHUB_TOKEN may not be allowed to write until package access is granted.
          # Note: GHCR may return 404 for unauthorized package metadata requests.
          PKG_URL="https://api.github.com/users/${OWNER}/packages/container/argus"
          HTTP=$(curl -s -o /tmp/pkg_preflight.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${PKG_URL}")
          echo "GHCR package metadata check HTTP ${HTTP}"
          if [ "${HTTP}" = "403" ]; then
            echo "ERROR: GITHUB_TOKEN cannot access ghcr.io/${OWNER}/argus yet."
            echo "Grant repository access in package settings, or set GHCR_PAT secret as fallback."
            cat /tmp/pkg_preflight.json
            exit 1
          fi
          if [ "${HTTP}" = "404" ]; then
            echo "INFO: Package metadata not visible with GITHUB_TOKEN (may be new package or ACL-hidden existing package)."
            echo "If push fails with 403, create GHCR_PAT (write:packages) and add it as repository secret."
          fi

      - name: Determine version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # refs/tags/v0.3.2-beta  →  0.3.2-beta
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="${{ inputs.version }}"
            TAG="v${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Stable if tag contains no pre-release suffix
          if echo "${TAG}" | grep -qE '(alpha|beta|rc)'; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR (PAT fallback)
        if: ${{ env.GHCR_PAT != '' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Log in to GHCR (GITHUB_TOKEN)
        if: ${{ env.GHCR_PAT == '' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push versioned tag
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/argus:${{ steps.meta.outputs.version }}

      - name: Also tag as latest (stable releases only)
        if: ${{ steps.meta.outputs.latest == 'true' }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository_owner }}/argus:latest" \
            "ghcr.io/${{ github.repository_owner }}/argus:${{ steps.meta.outputs.version }}"
          echo "Tagged ghcr.io/${{ github.repository_owner }}/argus:latest"
